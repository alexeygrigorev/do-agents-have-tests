version: "3.1"

nlu:
- intent: greet
  examples: |
    - hi
    - hello
    - good morning
    - hey there
    - hi ada
- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you
    - that's all, thanks
- intent: affirm
  examples: |
    - yes
    - sure
    - correct
    - indeed
- intent: deny
  examples: |
    - no
    - never
    - no thanks
    - not now
- intent: check_balance
  examples: |
    - what's my balance
    - check my balance
    - how much money do I have
    - I want to see my balance
    - show me my account balance
    - what is the balance on my account
    - can you check my balance
- intent: provide_account
  examples: |
    - savings
    - checking
    - credit
    - my savings account
    - the checking account
    - the credit card
    - savings please
- intent: out_of_scope
  examples: |
    - tell me a joke
    - what's the weather tomorrow
    - who won the game last night
    - order me a pizza
    - what is your favorite color
    - can you drive a car
    - sing me a song
