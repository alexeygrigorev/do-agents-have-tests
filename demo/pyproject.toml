[project]
name = "ada-bank-agent"
version = "0.1.0"
description = "Tiny Rasa Mantle customer-assistant agent with conversation evals"
requires-python = ">=3.14,<3.15"
dependencies = [
    "rasa-pro==3.20.0",
]

[tool.uv]
package = false
# Overrides ~/.config/uv/uv.toml `exclude-newer = "7 days"`, which otherwise
# drops rasa-pro 3.20.0 (published 2026-09-21).
exclude-newer = "2026-09-25T00:00:00Z"
