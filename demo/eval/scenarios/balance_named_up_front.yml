scenario:
  name: Customer names the savings account and gets its balance

  simulation_context: >
    You are a calm bank customer. Open by asking for the balance of your
    Rainy Day Savings account, naming it exactly like that in your first
    message. Answer any follow-up briefly. Once you have been told a balance,
    say thanks and end the conversation. Do not ask about anything else.

  goals:
    criteria:
      - The agent does not ask which account the customer means, because the
        first message already named Rainy Day Savings
      - The agent states the savings balance and the account name, and does
        not invent a figure
    assertions:
      - flow_started: check_balance
      - slot_was_set:
          - name: check_balance.selected_account_id
            value: acc_savings
      - action_executed: get_balance
      - bot_uttered:
          text_matches: "1,234\\.56"
