# Rex runs text-only until a speech integration is configured. This file
# is read by `rasa run` / `rasa inspect` on startup; everything below is
# commented out so the demo boots without speech API keys.
#
# To put Rex on voice (see the "Voice" section in README.md):
#   1. add DEEPGRAM_API_KEY=<key> to the repo-root .env
#   2. uncomment the block below
#   3. restart the server — the mic button in `rasa inspect` then streams
#      your browser microphone to Rasa's voice pipeline
#
# browser_audio:
#   server_url: localhost
#   asr:
#     name: deepgram
#   tts:
#     name: deepgram
#     voice: aura-asteria-en
#
# Other built-in engines (set under asr: / tts: as name: <engine>):
#   ASR: azure (AZURE_SPEECH_API_KEY + speech_region)
#   TTS: azure, cartesia (CARTESIA_API_KEY), deepgram_flux, rime (RIME_API_KEY)
#
# ElevenLabs is not built in. A custom engine subclasses ASREngine /
# TTSEngine from rasa.core.channels.voice_stream.* and is referenced by
# module path in credentials.yml, e.g. name: my_engines.MyElevenLabsTTS.
# `rasa tools init` scaffolds a custom component to start from.
