# The agent model. Simulator and judge live in eval/conftest.yml.
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-4.1
        api_key_env: OPENAI_API_KEY

channels:
  rest:
    enabled: true
  # The mic button in `rasa inspect` (inspector) and the raw browser voice
  # channel (browser_audio) use Rasa's built-in Deepgram engines.
  # DEEPGRAM_API_KEY lives in the repo-root .env. Defaults are Nova-3 for
  # speech-to-text and Aura-2 Thalia for text-to-speech.
  inspector:
    enabled: true
    server_url: localhost
    asr:
      name: deepgram
    tts:
      name: deepgram
  browser_audio:
    enabled: true
    server_url: localhost
    sample_rate: 24000
    asr:
      name: deepgram
    tts:
      name: deepgram
