# The agent model. Simulator and judge live in eval/conftest.yml.
llm:
  model_group: orchestrator

model_groups:
  - id: orchestrator
    models:
      - provider: openai
        # GPT-6 Luna at its highest reasoning effort. This LiteLLM build does
        # not know the model accepts reasoning_effort, so the param is allowlisted.
        # Chat completions reject function tools unless effort is none; the
        # server process must set LITELLM_ROUTE_ALL_CHAT_OPENAI_TO_RESPONSES=true
        # before startup so tool calls go through the Responses API.
        model: gpt-6-luna
        reasoning_effort: max
        allowed_openai_params:
          - reasoning_effort
        api_key_env: OPENAI_API_KEY

channels:
  rest:
    enabled: true
  # The mic button in `rasa inspect` (inspector) and the raw browser voice
  # channel (browser_audio) use Rasa's built-in Deepgram engines.
  # DEEPGRAM_API_KEY lives in the repo-root .env. Defaults are Nova-3 for
  # speech-to-text and Aura-2 Thalia for text-to-speech.
  inspector:
    enabled: true
    server_url: localhost
    asr:
      name: deepgram
    tts:
      name: deepgram
  browser_audio:
    enabled: true
    server_url: localhost
    sample_rate: 24000
    asr:
      name: deepgram
    tts:
      name: deepgram
