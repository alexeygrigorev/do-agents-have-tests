[project]
name = "field-guide-agent"
version = "0.1.0"
description = "Tiny Rasa Mantle agent that answers AI-engineering career questions from the AI Engineering Field Guide, with conversation evals"
requires-python = ">=3.14,<3.15"
dependencies = [
    "rasa-pro==3.20.0",
    "minsearch>=0.1",
    "pyyaml>=6.0",
]

[tool.uv]
package = false
# Overrides ~/.config/uv/uv.toml `exclude-newer = "7 days"`, which otherwise
# drops rasa-pro 3.20.0 (published 2026-09-21).
exclude-newer = "2026-09-25T00:00:00Z"
